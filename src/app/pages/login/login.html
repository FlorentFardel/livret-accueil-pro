<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-icon mat-card-avatar color="primary">admin_panel_settings</mat-icon>
      <mat-card-title>Accès Propriétaire</mat-card-title>
    </mat-card-header>
    
    <mat-card-content>
      <form (ngSubmit)="onSubmit()" class="login-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Mot de passe</mat-label>
          <input matInput [type]="hidePassword() ? 'password' : 'text'" 
                 [ngModel]="password()" (ngModelChange)="password.set($event)" 
                 name="password" required>
          <button mat-icon-button matSuffix type="button" (click)="hidePassword.set(!hidePassword())">
            <mat-icon>{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>
        
        @if (errorMsg()) {
          <p class="error-text">{{ errorMsg() }}</p>
        }

        <button mat-raised-button color="primary" type="submit" class="full-width" [disabled]="!password()">
          Se connecter
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
