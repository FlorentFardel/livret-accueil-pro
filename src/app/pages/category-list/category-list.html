<div class="navigation-header">
  <button mat-icon-button class="back-btn" routerLink="/" title="Retour Accueil">
    <mat-icon>arrow_back</mat-icon>
  </button>
  <h2 class="view-title">Livret d'Accueil</h2>
</div>

@if (isAdmin()) {
  <button mat-raised-button color="primary" class="full-width-btn admin-margin-btn" (click)="openForm()">
    <mat-icon>add</mat-icon> Ajouter une catégorie
  </button>
}

@if (isAdmin() && showForm()) {
  <mat-card class="admin-form-card">
    <h3>{{ catForm().id ? 'Modifier la catégorie' : 'Nouvelle catégorie' }}</h3>
    
    <mat-form-field appearance="outline" class="full-width-btn">
      <mat-label>Nom de la catégorie</mat-label>
      <input matInput [(ngModel)]="catForm().name" placeholder="ex: Wi-Fi, Équipements...">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width-btn">
      <mat-label>Icône Material Design</mat-label>
      <input matInput [(ngModel)]="catForm().icon" placeholder="ex: wifi, build...">
    </mat-form-field>

    <div class="form-actions">
      <button mat-button type="button" (click)="showForm.set(false)">Annuler</button>
      <button mat-raised-button color="primary" type="button" (click)="saveCategory()">Sauvegarder</button>
    </div>
  </mat-card>
}

<div class="category-grid">
  @for (cat of categories(); track cat.id) {
    <mat-card class="category-card" (click)="selectCategory(cat)">
      @if (isAdmin()) {
        <div class="tile-actions-corner">
          <button mat-icon-button color="primary" type="button" (click)="$event.stopPropagation(); openForm(cat)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" type="button" (click)="$event.stopPropagation(); deleteCategory(cat.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      }

      <div class="sub-header-align">
        <mat-icon color="primary" class="sub-material-icon">{{ cat.icon || 'folder' }}</mat-icon>
      </div>
      <div class="category-title">{{ cat.name }}</div>
    </mat-card>
  }
</div>
